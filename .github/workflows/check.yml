name: Check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows x64, macOS arm64, and Linux x64 per ADR 0027; a red job on any OS blocks merge.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # OpenTUI 0.4.5's Node path needs experimental FFI, first available in
          # official Node 26.4.0 (ADR 0018 adoption; the extraction research's
          # required Node line). `npm run check` compiles the Solid build and
          # runs the renderer frame tests on all three OS.
          node-version: 26.4.0
          cache: npm
      - run: npm ci
      - run: npm run check
