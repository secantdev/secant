name: Check

on:
  push:
  pull_request:

jobs:
  # The whole canonical gate on all three OS (Windows x64, macOS arm64, Linux x64
  # per ADR 0027): typecheck, format, lint, `bun test` with the Solid preload,
  # the host compile, and the compiled-binary smoke — under the pinned Bun alone,
  # with no Node toolchain step (ADR 0030).
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Reads the exact Bun pin from package.json's packageManager field.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  # One Linux runner cross-compiles all three gated targets (ADR 0030). The wide
  # install fetches every platform's @opentui native package so the compile can
  # embed the right one per target.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # @opentui/core@0.4.5 matches the dependency pin; a bump is a deliberate
      # gated PR (ADR 0027). The wide flags pull the native package for every
      # platform, not just this host's.
      - run: bun install --os="*" --cpu="*" "@opentui/core@0.4.5"
      - run: bun run scripts/build.ts --all
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/secant-*
          if-no-files-found: error
      # Assemble the three release archives once from the just-built candidate
      # bytes through the one target manifest, emitting the candidate manifest and
      # SHA256SUMS (#150). Never rebuilds an input; fails closed on disagreement.
      - run: bun run scripts/assemble.ts
      # Derive the target-specific runtime legal-closure inventory (#156) from the
      # actual compiler inputs (a real build of the shared input) and the installed
      # package metadata, emitting inventory-manifest.json beside the archives. This
      # runner has every platform's @opentui native installed, so the per-target
      # natives resolve. It rides in the release-archives artifact.
      - run: bun run scripts/inventory.ts
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/release
          if-no-files-found: error
      # Pack the three per-platform npm packages from the same candidate bytes the
      # archives carry, through the one target manifest (#151). It reads the
      # archive candidate manifest, never rebuilds an input, and fails closed on
      # any drift from that candidate; `bun pm pack` needs no Node toolchain.
      - run: bun run scripts/pack.ts
      # Pack the thin, script-free npm launcher (@secantdev/secant, #152) beside the
      # platform packages it declares as exact-version optional dependencies. It
      # carries the Node launcher and legal material but no candidate executable, and
      # pins the same assembled release version. It rides in the same artifact.
      - run: bun run scripts/pack-launcher.ts
      - uses: actions/upload-artifact@v4
        with:
          name: platform-packages
          path: dist/packages
          if-no-files-found: error

  # Each cross-compiled binary is smoked on its own OS with the compiled-binary
  # smoke, plus codesign --verify on macOS. The scenarios it covers are
  # enumerated once in docs/agents/testing.md (the one home) — not restated here.
  # The smoke harness runs under the pinned Bun; the binary it exercises is
  # standalone.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: secant-windows-x64.exe
          - os: macos-latest
            binary: secant-darwin-arm64
          - os: ubuntu-latest
            binary: secant-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # package-smoke replays the recorded Harness through the MCP permission
      # bridge, so its source-side test adapter dependencies must be installed on
      # this otherwise artifact-only runner as well as on the canonical check job.
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Restore the executable bit
        if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.binary }}"
      - run: bun scripts/package-smoke.ts "dist/${{ matrix.binary }}"

  # The `release-archive-consumer` scenario (#150): each final release archive is
  # extracted and verified on its own OS exactly as a consumer receives it —
  # layout, executable mode, inner-binary digest, bundled legal material, native
  # execution and version, and (macOS) the strict ad-hoc signature. It reads the
  # candidate manifest assembly emitted, so it verifies the same bytes the smoke
  # ran. No runtime deps, so this artifact-only runner needs no `bun install`.
  release-archive-consumer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: secant-windows-x64.zip
          - os: macos-latest
            archive: secant-darwin-arm64.zip
          - os: ubuntu-latest
            archive: secant-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/release
      - run: bun scripts/release-consumer.ts "dist/release/${{ matrix.archive }}"

  # The `platform-package-consumer` scenario (#151): each per-platform npm package
  # is installed with lifecycle scripts disabled and verified on its own OS
  # exactly as an npm consumer receives it — os/cpu constraint, exact version,
  # contents (executable and legal material only), the absence of any lifecycle
  # script, inner-binary digest against the archive candidate, executable mode,
  # native execution and version, and (macOS) the strict ad-hoc signature. npm is
  # the channel under test (ADR 0030), so this job drives it directly; the runners
  # ship npm, so no Node setup or `bun install` is needed.
  platform-package-consumer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: platform-packages
          path: dist/packages
      - run: bun scripts/package-consumer.ts dist/packages ${{ matrix.target }}

  # The `npm-launcher-consumer` scenario (#152): the thin, script-free npm launcher
  # installed with lifecycle scripts disabled, resolving the matching per-platform
  # package IN PLACE under npm-flat and pnpm-symlinked layouts, forwarding arguments,
  # stdio, and the native exit status, failing before spawn on a missing optional
  # package, and completing the Proof Bundle smoke (the M3 gate) end to end THROUGH
  # the launched command on its own OS. npm is the channel under test, so this job
  # drives it directly. It needs `bun install` for the recorded-replayer test helpers
  # (like the `smoke` job), and Node/npm/git ship on the runners. The scenario is
  # enumerated once in docs/agents/release-consumers.md (the one home) — not restated here.
  npm-launcher-consumer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: platform-packages
          path: dist/packages
      - run: bun scripts/launcher-consumer.ts dist/packages

  # The `release-legal-closure` scenario (#156): verify that THIRD-PARTY-NOTICES.md
  # covers the target-specific runtime closure actually embedded (the inventory the
  # build job emitted from the real compiler inputs) — every shipped component, its
  # shipped version, and its licence family — and that the exact source-of-truth
  # legal material is what every shipped channel carries (the three archives, three
  # platform packages, and launcher package; installer results stage the archive's
  # verified legal bytes, which the installer-consumer jobs re-check). The existing
  # fast declared-dependency check stays in `bun run check`. It reads the assembled
  # artifacts and the checked-out repo only, so this artifact-only runner needs no
  # `bun install`. The scenario is enumerated once in docs/agents/release-consumers.md.
  release-legal-closure:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: platform-packages
          path: dist/packages
      - run: bun scripts/release-legal-closure-consumer.ts dist/release dist/packages

  # The `powershell-installer-consumer` scenario (#154): macOS and Linux exercise
  # native unsupported-target detection before candidate access. Windows
  # installs the exact local archive into an isolated home, verifies the fixed
  # layout and executable, exercises latest/exact selection and PATH behavior,
  # and proves download/validation failures preserve the working installation.
  # It downloads no release bytes and requires no Git Bash, Node, or Bun.
  powershell-installer-consumer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/release
      - name: Refuse unsupported targets before reading candidates
        if: runner.os != 'Windows'
        shell: pwsh
        run: ./scripts/powershell-installer-consumer.ps1 -CandidateDirectory dist/release -Scenario unsupported
      - name: Install and run the local Windows x64 candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/powershell-installer-consumer.ps1 -CandidateDirectory dist/release -Scenario supported

  # The `posix-installer-consumer` scenario (#153) consumes the assembled local
  # candidate without network access. macOS arm64 and Linux x64 install, verify,
  # and run their matching archive from an isolated HOME; the Windows leg proves
  # target refusal happens before candidate access.
  posix-installer-consumer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/release
      - name: Install and run the local candidate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          isolated_home="$(mktemp -d)"
          application_home="$isolated_home/application-data"
          output="$(HOME="$isolated_home" SECANT_HOME="$application_home" sh ./install.sh --candidate-dir dist/release --no-modify-path)"
          printf '%s\n' "$output"
          test -x "$isolated_home/.secant/bin/secant"
          test ! -e "$application_home/bin/secant"
          expected_version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' dist/release/candidate-manifest.json | head -n 1)"
          test "$("$isolated_home/.secant/bin/secant" --version)" = "$expected_version"
          grep -F 'export PATH="$HOME/.secant/bin:$PATH"' <<<"$output"
          if [ "${{ runner.os }}" = 'macOS' ]; then
            grep -F 'Run Secant from Terminal; do not double-click a downloaded executable.' <<<"$output"
          fi
      - name: Refuse the unsupported Windows target before candidate access
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          hidden_candidate="$RUNNER_TEMP/not-present"
          if output="$(sh ./install.sh --candidate-dir "$hidden_candidate" 2>&1)"; then
            echo 'Expected the POSIX installer to refuse Windows.' >&2
            exit 1
          fi
          grep -F 'Unsupported platform: windows-x64' <<<"$output"
          if grep -F "$hidden_candidate" <<<"$output"; then
            echo 'The installer accessed its candidate source before refusing Windows.' >&2
            exit 1
          fi

  # The real-terminal lifecycle suite (#56), a separate blocking three-OS job
  # outside `bun run check` (ADR 0027 / ADR 0030). It drives the cross-compiled
  # binary for this OS under a `Bun.Terminal` pseudo-terminal and proves one
  # class — a terminal left broken after exit — over the quit, Ctrl+C, and
  # (POSIX) SIGHUP paths. No retries: a flaky case is fixed or moved to the
  # opt-in suite, never re-run to green.
  terminal:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: secant-windows-x64.exe
          - os: macos-latest
            binary: secant-darwin-arm64
          - os: ubuntu-latest
            binary: secant-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Restore the executable bit
        if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.binary }}"
      - run: bun tests/terminal/lifecycle.ts "dist/${{ matrix.binary }}"
