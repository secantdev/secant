name: Check

on:
  push:
  pull_request:

jobs:
  # The whole canonical gate on all three OS (Windows x64, macOS arm64, Linux x64
  # per ADR 0027): typecheck, format, lint, `bun test` with the Solid preload,
  # the host compile, and the compiled-binary smoke — under the pinned Bun alone,
  # with no Node toolchain step (ADR 0030).
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Reads the exact Bun pin from package.json's packageManager field.
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  # One Linux runner cross-compiles all three gated targets (ADR 0030). The wide
  # install fetches every platform's @opentui native package so the compile can
  # embed the right one per target.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # @opentui/core@0.4.5 matches the dependency pin; a bump is a deliberate
      # gated PR (ADR 0027). The wide flags pull the native package for every
      # platform, not just this host's.
      - run: bun install --os="*" --cpu="*" "@opentui/core@0.4.5"
      - run: bun run scripts/build.ts --all
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/secant-*
          if-no-files-found: error

  # Each cross-compiled binary is smoked on its own OS with the compiled-binary
  # smoke, plus codesign --verify on macOS. The scenarios it covers are
  # enumerated once in docs/agents/testing.md (the one home) — not restated here.
  # The smoke harness runs under the pinned Bun; the binary it exercises is
  # standalone.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: secant-windows-x64.exe
          - os: macos-latest
            binary: secant-darwin-arm64
          - os: ubuntu-latest
            binary: secant-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # package-smoke replays the recorded Harness through the MCP permission
      # bridge, so its source-side test adapter dependencies must be installed on
      # this otherwise artifact-only runner as well as on the canonical check job.
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Restore the executable bit
        if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.binary }}"
      - run: bun scripts/package-smoke.ts "dist/${{ matrix.binary }}"

  # The real-terminal lifecycle suite (#56), a separate blocking three-OS job
  # outside `bun run check` (ADR 0027 / ADR 0030). It drives the cross-compiled
  # binary for this OS under a `Bun.Terminal` pseudo-terminal and proves one
  # class — a terminal left broken after exit — over the quit, Ctrl+C, and
  # (POSIX) SIGHUP paths. No retries: a flaky case is fixed or moved to the
  # opt-in suite, never re-run to green.
  terminal:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: secant-windows-x64.exe
          - os: macos-latest
            binary: secant-darwin-arm64
          - os: ubuntu-latest
            binary: secant-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Restore the executable bit
        if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.binary }}"
      - run: bun tests/terminal/lifecycle.ts "dist/${{ matrix.binary }}"
