# Bun test runner config (ADR 0030). `@opentui/solid/preload` registers Solid's
# universal transform so `.tsx` presentation tests are reactive and the OpenTUI
# native renderer loads its FFI — the same transform `bun build --compile` gets
# from `@opentui/solid/bun-plugin`. A bare `bun test` picks this up, so the gate
# and a contributor's local run agree. Replaces the deleted Node runner + Babel
# loader.
[test]
preload = ["@opentui/solid/preload"]
# The per-test timeout is raised to 30s via `--timeout` in the `test` package
# script, not here: a command Step in a Run test spawns a real subprocess, and
# Windows process creation plus Bun cold-start is ~10x POSIX, so a spawn-heavy
# test can exceed Bun's 5s default on a slow CI Windows runner (a correct test
# failing as a flake, not a hang). This whole suite uses `node:test`, and a
# `[test] timeout` key here applies only to `bun:test`, so it never reached these
# tests; the CLI flag does (#86, #89).
