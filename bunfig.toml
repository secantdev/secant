# Bun test runner config (ADR 0030). `@opentui/solid/preload` registers Solid's
# universal transform so `.tsx` presentation tests are reactive and the OpenTUI
# native renderer loads its FFI — the same transform `bun build --compile` gets
# from `@opentui/solid/bun-plugin`. A bare `bun test` picks this up, so the gate
# and a contributor's local run agree. Replaces the deleted Node runner + Babel
# loader.
[test]
preload = ["@opentui/solid/preload"]
# The `test` package script supplies the runner settings that cannot live here:
# two isolated file workers and a 30s per-test timeout. File isolation keeps
# module-level test helpers owned by one file, while the timeout covers Windows
# process creation and Bun cold-start. This suite uses `node:test`, so the
# `[test].timeout` key applies only to `bun:test` and never reached these tests
# (#86, #89).
